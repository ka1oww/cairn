name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer worthless, but
# without this it keeps running and keeps billing -- and app-ios-simulator-build
# is on a macOS runner, whose minutes bill at ten times the Linux rate. Every
# job here fails instantly and identically once the account's spending limit is
# reached ("The job was not started because recent account payments have failed
# or your spending limit needs to be increased"), which reads exactly like a
# repo-wide code regression and is not one. Superseded runs are cancelled so the
# limit is spent on the commit actually under review. main is exempt: its runs
# are the record of what the branch was merged as, so they are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DART_SDK_VERSION: "3.13.1"
  FLUTTER_VERSION: "3.47.1"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # Discovers the pure-Dart packages under packages/*/pubspec.yaml so a fifth
  # package is picked up automatically -- the workflow never hardcodes names.
  discover-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          json=$(for f in packages/*/pubspec.yaml; do dirname "$f"; done | jq -R -s -c 'split("\n")[:-1]')
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  # dart analyze + dart test for every package the discovery step found.
  package-tests:
    needs: discover-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      # pubspec.lock is gitignored (root .gitignore), so it never exists at
      # checkout: hashFiles() over a path that matches nothing returns the
      # empty string, which collapsed every key here to a bare prefix. Key on
      # the committed pubspec.yaml instead, and scope each key to the thing it
      # caches -- the five matrix legs all wrote the one key `pub-Linux-` and
      # overwrote each other, and the learning demo saved the exact prefix
      # app-tests restored from. Every run then re-downloaded its dependencies,
      # which is runner minutes spent against a spending limit that is already
      # the reason this workflow's jobs are failing before they start.
      - name: Cache pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('{0}/pubspec.yaml', matrix.package)) }}
          restore-keys: pub-${{ runner.os }}-${{ matrix.package }}-
      - run: dart pub get
        working-directory: ${{ matrix.package }}
      - run: dart analyze
        working-directory: ${{ matrix.package }}
      - run: dart test
        working-directory: ${{ matrix.package }}

  # trip_moments' golden test only proves the VM and dart2js schedules agree
  # today. Reintroducing a bitwise operator in the hash (the exact failure
  # mode packages/trip_moments/README.md and the golden test warn about)
  # would still pass `dart test`, since that only runs on the VM. This job
  # regenerates the same golden lines under both compilers and diffs them --
  # see packages/trip_moments/tool/print_goldens.dart for the commands this
  # mirrors.
  trip-moments-js-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: dart pub get
        working-directory: packages/trip_moments
      - name: Generate golden lines on the Dart VM
        working-directory: packages/trip_moments
        run: dart run tool/print_goldens.dart > /tmp/vm.txt
      - name: Compile the same generator with dart2js
        working-directory: packages/trip_moments
        run: dart compile js -O0 -o /tmp/goldens.js tool/print_goldens.dart
      - name: Generate the same golden lines under Node
        run: node /tmp/goldens.js > /tmp/js.txt
      - name: VM and dart2js must agree byte-for-byte
        run: diff /tmp/vm.txt /tmp/js.txt

  # Drives the schema through the real RLS engine the way PostgREST does --
  # see supabase/README.md and supabase/tests/README.md. RLS refuses by
  # filtering rows to zero rather than raising, so this is the check that
  # catches an access-control regression looking exactly like a pass.
  supabase-rls-probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CAIRN_PG_HOST: 127.0.0.1
      CAIRN_PG_PORT: 5432
      CAIRN_PG_USER: postgres
      CAIRN_PG_PASSWORD: postgres
      CAIRN_PG_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pg8000
      - name: RLS probe (adversarial checks)
        working-directory: supabase/tests
        run: python3 rls_probe.py
      - name: Recursion mechanism check
        working-directory: supabase/tests
        run: python3 recursion_mechanism.py

  # Each edge function's refusals, run without deploying it -- which matters
  # because nothing in this repository has ever been deployed, so this job is
  # the only thing standing behind any decision either function makes. It is
  # possible at all because both are split the same way: handler.ts holds the
  # decisions and imports nothing remote, index.ts holds the clients. The
  # `deno check --no-remote` step is what keeps that split honest -- it fails
  # the moment a handler grows an import of supabase-js or aws4fetch, which
  # would put its refusals back out of reach.
  #
  # The matrix is discovered by hand rather than globbed, unlike
  # discover-packages above: a function without a handler_test.ts should fail
  # review, not silently skip a leg here.
  #
  # No step deploys anything, reads a secret, or touches the hosted Supabase
  # project.
  edge-function-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function: [r2-upload-url, r2-download-url]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: The handler decides nothing that needs a network
        working-directory: supabase/functions/${{ matrix.function }}
        run: deno check --no-remote handler.ts
      - name: What ${{ matrix.function }} refuses
        working-directory: supabase/functions/${{ matrix.function }}
        run: deno test handler_test.ts
      - name: The deployed entry point still type-checks against its clients
        working-directory: supabase/functions/${{ matrix.function }}
        run: deno check index.ts

  # The application at the repository root: Drift codegen (lib/**/*.g.dart
  # is not checked in -- see the root .gitignore), analysis, tests.
  # `flutter analyze` is scoped to lib/, test/ and tool/ because a bare run
  # from the root would also walk learning/ and packages/ -- separate projects
  # with their own dependency contexts, each covered by its own job here.
  # tool/ is named explicitly: the analyzer reports diagnostics for the files
  # it is given, not for everything they import, so a test importing a script
  # does not get that script analyzed.
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Cache pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-flutter-app-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-flutter-app-${{ runner.os }}-
      # drift's NativeDatabase in the widget tests opens the host SQLite;
      # the -dev package puts the unversioned libsqlite3.so on the loader
      # path. Usually preinstalled on the runner image -- this is insurance,
      # not a load-bearing assumption.
      - run: sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev
      - run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build
      - run: flutter analyze lib test tool
      - run: flutter test

  # Whether this commit can tell the iOS build anything. macOS minutes bill at
  # ten times the Linux rate, so one iOS build costs more than every Linux job
  # in this file combined -- and a docs-only commit spends that to rebuild an
  # app it did not touch. The spending limit is a hard wall, not a slowdown:
  # once it is reached every job here fails in about two seconds with a billing
  # annotation, which reads exactly like a repo-wide code regression and is not
  # one (this is the failure the concurrency block above also guards against).
  # A job skipped through `if` reports as skipped, which branch protection
  # counts as satisfied, so nothing is weakened for the commits this skips --
  # by construction they cannot break the iOS build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pushes to main carry no base to diff against, so they always build.
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD \
            | grep -Eq '^(lib/|ios/|test/|tool/|packages/|pubspec\.yaml|\.github/workflows/)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # The scaffold's claim is an app that actually builds for the phone, so CI
  # must build it the way the definition of done does: iOS simulator,
  # unsigned. macOS runner because the iOS toolchain exists nowhere else.
  # Android is deliberately absent -- no android/ directory exists.
  app-ios-simulator-build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    # Insurance, not a tuning knob: the default is six hours, and six hours of
    # a hung macOS job bills thirty-six hundred minutes -- enough to exhaust
    # the limit on its own and take every later run down with it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Cache pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-flutter-app-ios-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-flutter-app-ios-${{ runner.os }}-
      - run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build
      - run: flutter build ios --simulator --no-codesign

  # The Flutter learning demo, if it still has tests. See learning/README.md
  # and learning/riverpod-drift-demo/README.md for what it is and isn't.
  flutter-learning-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Cache pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-flutter-learning-${{ runner.os }}-${{ hashFiles('learning/riverpod-drift-demo/pubspec.yaml') }}
          restore-keys: pub-flutter-learning-${{ runner.os }}-
      - run: flutter pub get
        working-directory: learning/riverpod-drift-demo
      - name: Generate Drift code (database.g.dart etc. are not checked in)
        run: dart run build_runner build
        working-directory: learning/riverpod-drift-demo
      - run: flutter analyze
        working-directory: learning/riverpod-drift-demo
      - run: flutter test
        working-directory: learning/riverpod-drift-demo
