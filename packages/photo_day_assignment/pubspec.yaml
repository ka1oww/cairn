name: photo_day_assignment
description: >-
  Decides which day of a trip a photo belongs to, using a GPS-to-timezone
  degradation ladder instead of trusting the bare EXIF local timestamp. Pure
  Dart, no Flutter dependency, no network calls.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  timezone: ">=0.11.1 <1.0.0"
  timezone_finder: ^0.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
