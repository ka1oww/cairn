name: trip_moments
description: >
  Pure-Dart, offline, deterministic derivation of trip notification timing:
  one ping per person per day, dealt across the party as a collision-free
  permutation of slots over the trip's waking day, reshuffled daily, in the
  trip's own clock. Every phone derives the same schedule with no server.
version: 0.2.0
publish_to: 'none'

environment:
  sdk: ^3.0.0

dependencies:
  crypto: ^3.0.3

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
