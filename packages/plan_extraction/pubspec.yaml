name: plan_extraction
description: >-
  The Cairn file-import extraction band: one contract, bytes in and honest
  lines of plan text out. Pure Dart, no Flutter, no network, no I/O — the
  package never touches a file system; the app's picker edge reads the bytes.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.0.0

dependencies:
  archive: ^3.6.1
  csv: ^8.0.0
  excel: ^4.0.6
  xml: ^6.6.1

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
  # Dev-only: the round-trip test feeds the dialect renderer's output back
  # through the real parser (plan_rows.dart's honesty guard) — never a
  # runtime dependency of the package itself.
  itinerary_parser:
    path: ../itinerary_parser
