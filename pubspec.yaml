name: cairn
description: >-
  Cairn - a shared trip companion. One nudge a day, and the day fills in from
  everyone's own hour. This is the application shell; the reasoning lives in
  docs/decisions/ and the layering in docs/architecture.md.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

# Versions resolved from pub.dev on 2026-08-22 (see the scaffold PR for the
# reasoning). Notably NOT copied from learning/riverpod-drift-demo, whose pins
# are stale: the demo used flutter_riverpod 2.x (superseded by 3.x) and
# sqlite3_flutter_libs (end-of-life; native SQLite now ships through
# package:sqlite3 3.x's native-assets build hooks, pulled in by drift_flutter).
dependencies:
  flutter:
    sdk: flutter

  # App state. docs/architecture.md: the APP STATE band.
  flutter_riverpod: ^3.4.2

  # Local database. docs/architecture.md: the STORAGE band (Drift store).
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # The DOMAIN band: consumed, never modified, and kept Flutter-free.
  cairn_model:
    path: packages/cairn_model
  itinerary_parser:
    path: packages/itinerary_parser
  photo_day_assignment:
    path: packages/photo_day_assignment
  trip_moments:
    path: packages/trip_moments

  # The file-import extraction band (the DOMAIN-band sibling of the four
  # packages above): bytes in, honest lines of plan text out.
  plan_extraction:
    path: packages/plan_extraction

  # The iOS half of PDF reading. `plan_extraction` extracts with the pure-Dart
  # `pdfrx_engine`, but PDFium itself is a native library and `pdfium_dart`'s
  # build hook deliberately emits nothing for iOS
  # (`if (targetOS == OS.iOS) return;`) -- on Flutter/iOS the engine resolves
  # PDFium through `DynamicLibrary.process()`, so the symbols have to be linked
  # into the app. This plugin is what links them (an XCFramework via
  # CocoaPods); nothing in `lib/` imports it, and removing it builds fine and
  # then fails to read a single PDF on a device.
  pdfium_flutter: ^0.2.3

  # Platform edges the capture flow drives (docs/architecture.md draws these
  # beside the APP STATE band: services know them, they know nothing of Cairn).
  # The camera is back-only for the first release — the front inset is
  # explicitly after the line (docs/decisions/2026-08-22-camera-like-bereal.md).
  camera: ^0.12.0
  path_provider: ^2.1.6

  # The import feature's document picker (docs/architecture.md: a platform
  # edge beside the APP STATE band, reached only through lib/app_state/
  # file_picker_edge.dart). FileType.custom + allowedExtensions maps to
  # UTTypes, so Files, iCloud Drive and third-party providers all work; the
  # plugin copies picks into the sandbox and the edge reads their bytes.
  file_picker: ^12.1.0

  # The shared facts' transport (docs/architecture.md: the STORAGE band's
  # Supabase adapter). Plain HTTP rather than `supabase_flutter`: PostgREST is
  # an ordinary REST API over supabase/migrations/, and the package would
  # bring GoTrue, Realtime, Storage and a Podfile's worth of native
  # dependencies to save a hundred lines of JSON. Already in the tree
  # transitively; named here because lib/ imports it directly.
  http: ^1.6.0
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.5

dependency_overrides:
  # Slice B and slice C's readers disagree about one transitive package:
  # `pdfrx_engine` asks for `archive` ^4 (through `image`), while `excel` --
  # the only maintained xlsx reader -- is pinned to `archive` ^3 and does not
  # compile against ^4. Holding `archive` at ^3 is what lets one app read both
  # a spreadsheet and a PDF; nothing on the PDF path touches the archive API.
  # `packages/plan_extraction/pubspec.yaml` carries the same override for
  # `dart test`, because an override inside a path dependency is ignored.
  archive: ^3.6.1

flutter:
  uses-material-design: true

  # The house system's text face (docs/design/README.md, "House system"):
  # Atkinson Hyperlegible carries all running text. Bundled from Google Fonts'
  # OFL-licensed release (assets/fonts/OFL-AtkinsonHyperlegible.txt); the
  # container's tab bar is its first consumer (lib/screens/house_style.dart).
  # Young Serif (display) is not bundled yet — nothing built sets display type.
  fonts:
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700

  # The area gazetteer (tap-to-Maps phase 2). Built by
  # tool/build_area_gazetteer.dart from the GeoNames dumps, which are
  # downloaded by hand and never committed — only these compact assets are.
  # They are read ON IMPORT ONLY, off the UI thread, and never at launch or
  # on the day/trail path: lib/app_state/area_gazetteer_loader.dart is the
  # whole rule. GeoNames data is CC-BY 4.0 and each asset carries its own
  # attribution header; the app repeats it in lib/acknowledgements.dart.
  assets:
    - assets/area_gazetteer/
